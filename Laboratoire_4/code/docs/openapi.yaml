      tags:
      - comptes
      summary: Lister les comptes (MANAGE_USERS), ou seulement ceux qu'on peut assigner
      operationId: lister_comptes_api_v1_comptes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: assignables
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Assignables
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
