      tags:
      - comptes
      summary: S'inscrire (role Rapporteur)
      operationId: inscrire_api_v1_comptes_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Inscription'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inscrit'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unauthorized
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
          description: Unprocessable Entity
