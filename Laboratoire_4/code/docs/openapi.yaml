openapi: 3.1.0
info:
  title: 'Gestionnaire de tickets : API REST'
  description: 'API REST du gestionnaire de tickets (6GEI311, laboratoire 4).


    Toutes les regles restent celles du modele du labo 2 : le serveur ne fait que les exposer.

    Pour essayer : `POST /api/v1/sessions` avec un compte de demonstration (alice@uqac.ca / alice-2026),

    puis bouton **Authorize** avec le jeton recu.


    Erreurs : toujours `{motif, details, cause}`. 401 jeton absent ou invalide ; 403 permission absente des

    roles ; 404 ressource inexistante ou invisible ; 409 l''etat du ticket ne le permet pas ; 422 argument refuse.

    '
  version: 4.0.0
paths:
  /api/v1/sante:
    get:
      tags:
      - service
      summary: Le serveur repond (utilise par le client pour le reveiller)
      operationId: sante_api_v1_sante_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sante'
  /api/v1/sessions:
    post:
      tags:
      - sessions
      summary: 'Se connecter : echange courriel et mot de passe contre un jeton d''acces'
      operationId: ouvrir_session_api_v1_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Connexion'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionJSON'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
  /api/v1/moi:
    get:
      tags:
      - sessions
      summary: 'Profil du compte connecte : roles et permissions'
      operationId: moi_api_v1_moi_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilJSON'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erreur'
      security:
      - HTTPBearer: []
  /api/v1/comptes:
