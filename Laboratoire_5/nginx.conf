# Bloc http a mettre a la place de http { ... } dans conf/nginx.conf (dossier de nginx, machine du membre A).
# Remplacer IP_MACHINE_B par l'adresse Wi-Fi de la machine du membre B (ipconfig), et verifier
# IP_MACHINE_A le jour meme : sur eduroam, l'adresse change d'une connexion a l'autre.
#
# Difference avec l'enonce : la ligne « try_files $uri $uri/ =404; » est retiree du bloc location.
# try_files s'execute avant proxy_pass : nginx cherche d'abord un fichier dans son propre dossier html
# et repond lui-meme (sa page d'accueil ou une erreur 404) ; la requete n'atteint jamais les applications.
http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream labcluster {
        server 172.19.129.254:3000;   # IP_MACHINE_A : application du membre A
        server IP_MACHINE_B:3001;     # application du membre A, lancee sur la machine du membre B
    }

    server {
        listen 8181 default_server;

        location / {
            proxy_pass http://labcluster;
        }
    }
}
